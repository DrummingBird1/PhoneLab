name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      # Only findings not already recorded in app/lint-baseline.xml fail the build.
      - name: Lint (release variants of both flavors)
        run: ./gradlew lintPlayRelease lintFossRelease --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: App/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
