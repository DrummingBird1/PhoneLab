name: Android Release (Play internal track)

# Manual trigger only: builds a signed release AAB and uploads it to the Google Play
# internal testing track as a DRAFT release (promote it from Play Console). "What's new"
# comes from fastlane/metadata/android/<locale>/changelogs/<versionCode>.txt; tick
# "listing" to also upload the store listing in App/app/src/play/play/.
#
# Required repository secrets (setup: Distribution/play/README.md):
#   KEYSTORE_BASE64            base64 of the upload keystore (Distribution/Keys/PhoneLab-Key)
#   KEYSTORE_PASSWORD          keystore password
#   KEY_ALIAS                  key alias inside the keystore
#   KEY_PASSWORD               key password
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of a Play Console service account with release rights
on:
  workflow_dispatch:
    inputs:
      listing:
        description: Also upload the store listing (text, graphics)
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and publish to Play internal track
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew publishPlayReleaseBundle ${{ inputs.listing && 'publishPlayReleaseListing' || '' }} --console=plain

      - name: Upload AAB and R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            App/app/build/outputs/bundle/playRelease/*.aab
            App/app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: ignore
