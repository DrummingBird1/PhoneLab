plugins {
    id 'com.android.application'
    id 'com.github.triplet.play'
}

// Release signing is driven by key.properties in the module root (git-ignored).
// Copy key.properties.template → key.properties and fill in the real values.
// If the file is absent (CI, a fresh clone, debug-only work) the release build
// simply stays unsigned instead of failing — sign manually or provide the file.
def keystorePropsFile = rootProject.file('key.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.sensolab.devicemonitor'
    compileSdk 36

    defaultConfig {
        applicationId "com.sensolab.devicemonitor"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.3.0"
        vectorDrawables.useSupportLibrary = true

        // Y6: Privacy policy URL — empty hides the link in About. Required by Play Store
        //     for apps with sensitive permissions (BODY_SENSORS, location). Published from
        //     the separate phonelab-privacy GitHub Pages repo.
        buildConfigField "String", "PRIVACY_POLICY_URL", '"https://drummingbird1.github.io/phonelab-privacy/"'
    }

    // Two distribution builds of the same app id:
    //  • play — Google Play; includes the Play Billing tip jar.
    //  • foss — GitHub Releases, F-Droid, IzzyOnDroid and other stores. No proprietary
    //    libraries, so no tip jar and no INTERNET permission at all.
    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "boolean", "PLAY_BUILD", "true"
        }
        foss {
            dimension "distribution"
            buildConfigField "boolean", "PLAY_BUILD", "false"
        }
    }

    // C3: AGP 8+ disables BuildConfig generation by default.
    // Need it on for BuildConfig.VERSION_NAME (used in exported spec file) and BuildConfig.DEBUG (N8).
    buildFeatures {
        buildConfig true
        viewBinding true
    }

    // Generates the per-app language list (Android 13+ system Settings → App languages)
    // from the values-* folders, so a newly added translation shows up automatically.
    // The default (unqualified) locale is declared in res/resources.properties.
    androidResources {
        generateLocaleConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only attach the signing config when key.properties is present.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
        debug {
            debuggable true
            // A8: separate package id so debug and release builds coexist on a device.
            // Final ids: com.sensolab.devicemonitor (release), com.sensolab.devicemonitor.debug
            applicationIdSuffix '.debug'
            versionNameSuffix  '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // N5: enables java.time.*, java.util.stream.*, etc. on API < 26 via desugaring.
        // We target minSdk 26 so this is mostly a future-proof, but it costs nothing.
        coreLibraryDesugaringEnabled true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Baseline captures today's existing lint findings so only NEW issues fail the build.
    // Regenerate with `./gradlew lintRelease -Plint.baselines.continue=true` after a
    // deliberate cleanup, then delete+re-run once to reset the baseline to zero.
    lint {
        baseline = file("lint-baseline.xml")
    }

    // Gradle Play Publisher per-flavor override: the foss build never goes to Google Play.
    playConfigs {
        register("foss") { enabled.set(false) }
    }
}

// Gradle Play Publisher. Credentials come from App/play-service-account.json (git-ignored)
// or the ANDROID_PUBLISHER_CREDENTIALS env var (CI secret). Without either, the publish
// tasks are disabled so ordinary builds never need Play credentials.
play {
    def creds = rootProject.file('play-service-account.json')
    def hasEnvCreds = System.getenv('ANDROID_PUBLISHER_CREDENTIALS') != null
    enabled.set(creds.exists() || hasEnvCreds)
    if (creds.exists()) serviceAccountCredentials.set(creds)
    track.set('internal')
    defaultToAppBundles.set(true)
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.DRAFT)
}

// Play listing text and graphics live in src/play/play/ (GPP's layout). Play's "What's new"
// is the per-version changelog F-Droid and IzzyOnDroid already read, synced into GPP's
// release-notes folder (git-ignored) right before GPP merges its resources, so a release
// can never go out with the previous version's notes. Map: fastlane locale → Play locales.
def playNoteLocales = ['en-US': ['en-US'], he: ['iw-IL'], es: ['es-ES', 'es-419'], ar: ['ar']]
def playNoteSources = playNoteLocales.collectEntries { fastlaneLocale, playLocales ->
    [(rootProject.file("../fastlane/metadata/android/$fastlaneLocale/changelogs/${android.defaultConfig.versionCode}.txt")): playLocales]
}
def syncPlayReleaseNotes = tasks.register('syncPlayReleaseNotes', Sync) {
    into 'src/play/play/release-notes'
    playNoteSources.each { notes, playLocales ->
        playLocales.each { playLocale ->
            from(notes) {
                into playLocale
                rename { 'default.txt' }
            }
        }
    }
}
tasks.matching { it.name == 'generatePlayReleasePlayResources' }.configureEach {
    dependsOn syncPlayReleaseNotes
    doFirst {
        def missing = playNoteSources.keySet().findAll { !it.exists() }
        if (missing) {
            throw new GradleException("Play release notes need a changelog for versionCode " +
                    "${android.defaultConfig.versionCode}: ${missing.join(', ')}")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'        // EdgeToEdge
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.biometric:biometric:1.1.0' // Hardware tab biometric availability check
    implementation 'androidx.work:work-runtime:2.12.0'  // periodic background checks (thermal, alerts, battery history)
    playImplementation 'com.android.billingclient:billing:8.3.0' // tip jar — play flavor only

    // N5: desugaring runtime — enables java.time / java.nio.file APIs on older devices
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // A6: local JUnit tests (run via `./gradlew test`)
    testImplementation 'junit:junit:4.13.2'
}
